[Rainmeter]
Update=800
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Matt Daily Notes
Author=Matt
Information=Retro productivity dashboard for notes, tasks, goals, and achievements
Version=1.0


; ==================================================
; VARIABLES
; ==================================================

[Variables]
FontName=Consolas
TextColor=105,245,125,255
MutedColor=70,180,90,255
AccentColor=125,255,145,255
DimColor=40,110,55,255
BackgroundColor=3,10,4,242
BorderColor=82,235,105,255
GlowColor=80,255,110,45
GlowStrong=100,255,125,70

WriteMode=0
CurrentView=Notes
TaskDraft=
TaskType=normal
TaskWeeklyGoal=0
TaskMonthlyGoal=0
TaskWizardStep=0
TaskConfirm=0
TaskDetailMode=0

SelectedTaskId=0
SelectedTaskName=
SelectedTaskType=
SelectedTaskWeekly=0
SelectedTaskMonthly=0

EditTaskName=
EditTaskType=normal
EditTaskWeekly=0
EditTaskMonthly=0
EditTaskStep=0
EditGoalInputRaw=

NoteDraft=
ToggleTaskId=0

; ==================================================
; DATE
; ==================================================

[MeasureDate]
Measure=Time
Format=%a, %b %#d


; ==================================================
; NOTES
; ==================================================

[MeasureNotes]
Measure=Script
ScriptFile=#@#ReadNotes.lua
UpdateDivider=1

[MeasureTasks]
Measure=Script
ScriptFile=#@#ReadTasks.lua
UpdateDivider=1

[MeasureEntryCount]
Measure=Script
ScriptFile=#@#EntryCount.lua
UpdateDivider=1

[MeasureGoalTracker]
Measure=Script
ScriptFile=#@#GoalTracker.lua
UpdateDivider=1

[MeasureAchievement]
Measure=Script
ScriptFile=#@#Achievement.lua
UpdateDivider=1

; ==================================================
; AUTOMATIC ARCHIVE
; ==================================================

[MeasureArchive]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\ArchiveNotes.ps1" -TodayFile "#@#Today.txt" -DateFile "#@#CurrentDate.txt"
State=Hide
UpdateDivider=60
FinishAction=[!UpdateMeasure MeasureNotes][!UpdateMeasure MeasureEntryCount][!UpdateMeter Notes][!UpdateMeter NotesGlow][!UpdateMeter FooterRight][!Redraw]

[MeasureArchiveTrigger]
Measure=Calc
Formula=Counter
UpdateDivider=60
IfCondition=1
IfTrueAction=[!CommandMeasure MeasureArchive "Run"]
DynamicVariables=1

[MeasureAddNote]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\AddNote.ps1" -Note "#NoteDraft#" -TodayFile "#@#Today.txt"
State=Hide
DynamicVariables=1

FinishAction=[!SetVariable WriteMode "0"][!HideMeterGroup WriteView][!ShowMeterGroup SharedViewport][!ShowMeterGroup NotesView][!ShowMeterGroup ViewSelector][!SetOption HeaderLabel Text "DATA // QUICK NOTES"][!SetOption HeaderGlow Text "DATA // QUICK NOTES"][!SetOption SystemStatus Text "SYS // READY"][!SetOption SystemStatus FontColor "#DimColor#"][!UpdateMeasure MeasureNotes][!UpdateMeasure MeasureEntryCount][!CommandMeasure MeasureNotes "ScrollBottom()"][!UpdateMeter *][!SetOption AddNote Text "[ OK ] LOGGED"][!Redraw][!Delay 1200][!SetOption AddNote Text "[ + ] ADD NOTE"][!UpdateMeter AddNote][!Redraw]


; ==================================================
; MANUAL ARCHIVE
; ==================================================

[MeasureManualArchive]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\ArchiveNotes.ps1" -TodayFile "#@#Today.txt" -DateFile "#@#CurrentDate.txt" -Force
State=Hide
FinishAction=[!UpdateMeasure MeasureNotes][!UpdateMeasure MeasureEntryCount][!UpdateMeter Notes][!UpdateMeter NotesGlow][!UpdateMeter FooterRight][!SetOption ArchiveNow Text "[ OK ] SAVED"][!SetOption ArchiveNow FontColor "#AccentColor#"][!UpdateMeter ArchiveNow][!Redraw][!Delay 1500][!SetOption ArchiveNow Text "[ > ] ARCHIVE"][!SetOption ArchiveNow FontColor "#MutedColor#"][!UpdateMeter ArchiveNow][!Redraw]

[MeasureClearTasks]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\ClearCompletedTasks.ps1" -TasksFile "#@#Tasks.txt"
State=Hide
FinishAction=[!UpdateMeasure MeasureTasks][!UpdateMeterGroup TasksView][!SetOption ClearDone Text "[ OK ] CLEARED"][!SetOption ClearDone FontColor "#AccentColor#"][!UpdateMeter ClearDone][!Redraw][!Delay 1200][!SetOption ClearDone Text "[ > ] CLEAR DONE"][!SetOption ClearDone FontColor "#MutedColor#"][!UpdateMeter ClearDone][!Redraw]

[MeasureViewController]
Measure=Script
ScriptFile=#@#ViewController.lua
UpdateDivider=-1

[MeasureToggleNormalTask]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\ToggleTask.ps1" -TasksFile "#@#Tasks.txt" -HistoryFile "#@#TaskHistory.txt" -TaskId "#ToggleTaskId#"
State=Hide
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureTasks][!UpdateMeterGroup TasksView][!Redraw]

[MeasureCompleteRepeatTask]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\ToggleTask.ps1" -TasksFile "#@#Tasks.txt" -HistoryFile "#@#TaskHistory.txt" -TaskId "#ToggleTaskId#"
State=Hide
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasks "CompleteRepeat(#ToggleTaskId#)"][!CommandMeasure MeasureAchievement "Check(#ToggleTaskId#)"]


[MeasureDeleteTask]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#CURRENTPATH#..\Scripts\DeleteTask.ps1" -TasksFile "#@#Tasks.txt" -HistoryFile "#@#TaskHistory.txt" -TaskId "#SelectedTaskId#"
State=Hide
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureViewController "FinishDeleteTask()"]


[MeasureSaveEditedTask]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=
State=Hide
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureViewController "ShowTaskEdited()"][!Delay 1000][!CommandMeasure MeasureViewController "FinishEditTask()"]

; ==================================================
; WRITE CURSOR
; ==================================================

[MeasureCursorBlink]
Measure=Calc
Formula=(Counter % 2)
UpdateDivider=1

[MeasureCursorState]
Measure=Calc
Formula=MeasureCursorBlink
IfCondition=(#WriteMode# = 1) && (MeasureCursorState = 1)
IfTrueAction=[!ShowMeter WriteCursor][!Redraw]
IfFalseAction=[!HideMeter WriteCursor][!Redraw]
DynamicVariables=1

[MeasureCRTFlicker]
Measure=Calc
Formula=(Counter % 19 = 0 ? 7 : (Counter % 7 = 0 ? 3 : 0))
UpdateDivider=1

; ==================================================
; NOTE INPUT
; ==================================================

[MeasureInput]
Measure=Plugin
Plugin=InputText

X=27
Y=90
W=256
H=75

FontFace=#FontName#
FontSize=9
FontColor=105,245,125
SolidColor=3,10,4,255
DefaultValue=""
FocusDismiss=1

Command1=[!SetVariable NoteDraft "$UserInput$"][!UpdateMeasure MeasureAddNote][!CommandMeasure MeasureAddNote "Run"]

[MeasureTaskInput]
Measure=Plugin
Plugin=InputText

X=27
Y=90
W=256
H=75

FontFace=#FontName#
FontSize=9
FontColor=105,245,125
SolidColor=3,10,4,255

DefaultValue=""
FocusDismiss=1

Command1=[!SetVariable TaskDraft "$UserInput$"][!SetVariable TaskWizardStep "1"]

Command2=[!SetOption WriteModeLabel Text "> TASK TYPE"][!HideMeter WriteCursor][!HideMeter TrackNone][!HideMeter TrackWeekly][!HideMeter TrackMonthly][!HideMeter TrackBoth][!HideMeter TrackNoneIndicator][!HideMeter TrackWeeklyIndicator][!HideMeter TrackMonthlyIndicator][!HideMeter TrackBothIndicator][!ShowMeter TaskTypeNormal][!ShowMeter TaskTypeRepeat][!UpdateMeter *][!Redraw]

[MeasureGoalInput]
