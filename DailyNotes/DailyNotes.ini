Plugin=InputText

X=27
Y=90
W=256
H=75

FontFace=#FontName#
FontSize=9
FontColor=105,245,125
SolidColor=3,10,4,255

DefaultValue=""
FocusDismiss=1

Command1=[!CommandMeasure MeasureViewController "ProcessGoalInput('$UserInput$')"]

[MeasureMonthlyGoalInput]
